name: CI

# Reusable workflow: builds + tests the app, and typechecks + synthesizes +
# validates the CDK infrastructure. Called by pr.yml (on PRs) and deploy.yml
# (as the pre-deploy gate).
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the caller's ref).
        type: string
        required: false
        default: ""

jobs:
  app-build-test:
    name: Build, lint & test (app)
    runs-on: ubuntu-latest
    env:
      # Prisma reads these from the schema's datasource block at `prisma generate`
      # time. No real DB is contacted during generate/typecheck/build/tests.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate -w server
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  infra-validate:
    name: Synth & validate CFN (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CDK deps
        run: npm ci
      - name: Typecheck (CDK)
        run: npm run typecheck
      - name: Synthesize CloudFormation
        run: npx cdk synth
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Validate synthesized templates
        run: cfn-lint cdk.out/*.template.json
